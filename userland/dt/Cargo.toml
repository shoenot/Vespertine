[package]
name = "dt"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dt"
test = false
bench = false

[dependencies]
vrt = { package = "vespertine-rt", path = "../../lib/vespertine-rt" }
vabi = { package = "vespertine-abi", path = "../../lib/vespertine-abi" }
vstd = { package = "vespertine-std", path = "../../lib/vespertine-std" }
vapp = { package = "vespertine-app", path = "../../lib/vespertine-app" }
vcli = { package = "vespertine-cli", path = "../../lib/vespertine-cli/" }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
chrono-tz = { version = "0.10", default-features = false, features = ["case-insensitive"] }
