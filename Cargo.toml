[workspace]
members = [
    "kernel",
    "lib/vespertine-abi",
    "lib/vespertine-common",
    "lib/vespertine-rt", "lib/vespertine-std", "userland/dt", "userland/dusk", "userland/hesper", "userland/ns", "userland/shell", "userland/terminal"]

resolver = "2"

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"     
lto = true          
codegen-units = 1   
panic = "abort"     
strip = false        
debug = true
