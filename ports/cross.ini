[binaries]
c = 'clang'
cpp = 'clang++'
ar = 'llvm-ar'
strip = 'llvm-strip'
cpp_ld = 'lld'
c_ld = 'lld'

[host_machine]
system = 'vespertine'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]
b_lundef = false
c_args = [
    '--target=x86_64-unknown-elf',
    '-ffreestanding',
    '-nostdlibinc',
    '-D__vespertine__=1',
    '-D_GNU_SOURCE',
    '-fno-plt'
  ]
cpp_args = [
    '--target=x86_64-unknown-elf',
    '-ffreestanding',
    '-nostdlibinc',
    '-D__vespertine__=1',
    '-D_GNU_SOURCE',
    '-fno-plt'
  ]
c_link_args = [
    '--target=x86_64-unknown-elf',
    '-nostdlib',
    '-fuse-ld=lld',
    '-Wl,--allow-shlib-undefined',
    '-Wl,-z,now'
  ]
cpp_link_args = [
    '--target=x86_64-unknown-elf',
    '-nostdlib',
    '-fuse-ld=lld',
    '-Wl,--allow-shlib-undefined',
    '-Wl,-z,now'
  ]
